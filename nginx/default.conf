server {
    listen 80;
    server_name _;

    root /var/www/public;
    index index.php index.html;

    charset utf-8;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;  # includes fastcgi_params + try_files

        # ✅ Use [::1]:9000 only if php-fpm is listening on IPv6 localhost.
        # 🔁 Otherwise switch to 127.0.0.1:9000 for IPv4.
        fastcgi_pass 127.0.0.1:9000;

        # 🔧 Depending on your setup, either $realpath_root or $document_root may work better
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
